<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Luum과 LiviDuvy의 일정과 작업을 함께 관리하는 졸업전시 팀 작업 공간"
    />
    <title>졸업전시 팀 대시보드</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <section id="authGate" class="auth-gate" hidden aria-labelledby="authTitle">
      <form id="loginForm" class="auth-card">
        <span class="auth-mark" aria-hidden="true">✳</span>
        <h1 id="authTitle">졸업전시 팀 대시보드</h1>
        <label for="loginEmail">팀 이메일</label>
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com" />
        <button class="button primary" type="submit">로그인 링크 받기</button>
        <p id="loginMessage" class="auth-message" role="status"></p>
      </form>
    </section>
    <main class="shell" id="main">
      <header class="page-header">
        <h1>졸업전시 팀 대시보드</h1>
        <div class="header-tools">
          <span class="save-indicator" id="saveIndicator" role="status">불러오는 중</span>
          <button id="signOutButton" class="text-button" hidden>로그아웃</button>
        </div>
      </header>
      <div id="storageWarning" class="notice" role="alert" hidden></div>
      <section class="calendar-section" aria-labelledby="calendarTitle">
        <div class="section-head">
          <div class="section-title">
            <h2 id="calendarTitle">통합 캘린더</h2>
            <span class="section-meta" id="calendarCount"></span>
          </div>
          <div class="calendar-nav">
            <button class="button quiet" id="todayButton">오늘</button
            ><button class="icon-button" id="prevMonth" aria-label="이전 달">
              <span data-icon="left"></span>
            </button>
            <h3 id="monthLabel" aria-live="polite"></h3>
            <button class="icon-button" id="nextMonth" aria-label="다음 달">
              <span data-icon="right"></span>
            </button>
          </div>
        </div>
        <div class="filterbar" aria-label="작업 필터">
          <div
            class="project-tabs"
            id="projectTabs"
            aria-label="프로젝트 선택"
          ></div>
          <div class="filter-controls">
            <label class="select-wrap"
              ><span data-icon="person"></span
              ><span class="sr-only">담당자 필터</span
              ><select id="ownerFilter">
                <option value="">모든 담당자</option>
                <option value="__none">담당자 미정</option>
                <option>이유진</option>
                <option>임다혜</option>
                <option>강주원</option>
                <option>윤서영</option>
              </select></label
            ><label class="switch-label"
              ><input id="showDone" type="checkbox" /><span
                class="switch"
                aria-hidden="true"
              ></span
              >완료 보기</label
            >
          </div>
        </div>
        <div class="calendar-scroll">
          <div id="calendar" class="calendar" aria-label="월간 작업 일정">
            <div class="loading">일정을 불러오고 있어요.</div>
          </div>
        </div>
        <div class="calendar-footer">
          <span class="calendar-legend"
            ><span class="legend-dot luum"></span>Luum<span
              class="legend-dot livy"
            ></span
            >LiviDuvy</span
          ><button class="text-button" id="undatedButton">
            날짜 미정 <span id="undatedCount">0</span
            ><span data-icon="right"></span>
          </button>
        </div>
        <section
          class="day-agenda"
          id="dayAgenda"
          aria-label="선택한 날짜의 작업"
          hidden
        ></section>
      </section>
      <section class="task-section" aria-labelledby="tasksTitle">
        <div class="section-head">
          <div class="section-title">
            <h2 id="tasksTitle">작업 현황</h2>
            <span class="section-meta" id="taskCount"></span>
          </div>
          <button class="button secondary small" data-action="create">
            <span data-icon="plus"></span>새 작업
          </button>
        </div>
        <div class="task-toolbar">
          <div class="view-tabs" role="tablist" aria-label="작업 보기">
            <button
              role="tab"
              id="tableTab"
              aria-selected="true"
              aria-controls="tableView"
              data-view="table"
            >
              <span data-icon="list"></span>전체 작업</button
            ><button
              role="tab"
              id="boardTab"
              aria-selected="false"
              aria-controls="boardView"
              data-view="board"
            >
              <span data-icon="board"></span>진행 현황</button
            ><button
              role="tab"
              id="activityTab"
              aria-selected="false"
              aria-controls="activityView"
              data-view="activity"
            >
              <span data-icon="clock"></span>팀원별 기록
            </button>
          </div>
          <div class="scope-tabs" aria-label="작업 일정 범위">
            <button data-scope="all" aria-pressed="true">전체</button
            ><button data-scope="today" aria-pressed="false">
              오늘 할 일 <span id="todayCount"></span>
            </button>
          </div>
        </div>
        <div id="tableView" role="tabpanel" aria-labelledby="tableTab">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col" class="title-column">작업명</th>
                  <th scope="col">기간 · 마감일</th>
                  <th scope="col">담당자</th>
                  <th scope="col">프로젝트</th>
                  <th scope="col">상태</th>
                </tr>
              </thead>
              <tbody id="taskRows"></tbody>
            </table>
          </div>
          <button class="add-row" data-action="create">
            <span data-icon="plus"></span>새 작업 추가
          </button>
        </div>
        <div id="boardView" role="tabpanel" aria-labelledby="boardTab" hidden>
          <div class="board-controls" aria-label="진행 현황 기준">
            <button data-board-mode="task" aria-pressed="true">작업별</button
            ><button data-board-mode="member" aria-pressed="false">
              개인별
            </button>
          </div>
          <div id="board" class="board"></div>
        </div>
        <div
          id="activityView"
          role="tabpanel"
          aria-labelledby="activityTab"
          hidden
        >
          <div class="activity-head">
            <div
              class="activity-members"
              id="activityMembers"
              aria-label="기록할 팀원별 보기"
            ></div>
          </div>
          <form id="worklogForm" class="worklog-composer">
            <label class="sr-only" for="noteMember">기록할 팀원</label
            ><select id="noteMember" required>
              <option value="">팀원 선택</option>
              <option>이유진</option>
              <option>임다혜</option>
              <option>강주원</option>
              <option>윤서영</option>
            </select>
            <label class="sr-only" for="noteTask">기록할 작업</label
            ><select id="noteTask" required>
              <option value="">작업 선택</option>
            </select>
            <label class="sr-only" for="noteText">작업 내용</label
            ><input
              id="noteText"
              placeholder="작업한 내용"
              maxlength="2000"
              required
              autocomplete="off"
            />
            <button type="submit" class="button secondary small">기록</button>
          </form>
          <p id="worklogError" class="form-error" role="alert"></p>
          <div id="activityList" class="activity-list"></div>
          <button id="activityMore" class="text-button" hidden>더 보기</button>
        </div>
      </section>
      <section class="resources-section" aria-labelledby="resourcesTitle">
        <div class="section-head">
          <h2 id="resourcesTitle">팀 자료 바로가기</h2>
        </div>
        <div id="links" class="resource-grid"></div>
      </section>
    </main>
    <dialog id="createDialog" aria-label="새 작업" class="create-dialog">
      <form id="createForm">
        <div class="dialog-header">
          <h2>새 작업</h2>
          <button
            class="icon-button"
            type="button"
            data-close="createDialog"
            aria-label="새 작업 창 닫기"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <label class="sr-only" for="newName">작업명</label
        ><input
          id="newName"
          class="title-input"
          placeholder="작업명"
          required
          maxlength="500"
          autocomplete="off"
        />
        <fieldset class="project-picker">
          <legend>프로젝트</legend>
          <div id="newProjectChoices" class="choice-row"></div>
        </fieldset>
        <div class="quick-options">
          <button
            type="button"
            class="button quiet"
            id="expandCreate"
            aria-expanded="false"
            aria-controls="newExtras"
          >
            <span data-icon="sliders"></span>담당자·일정<span
              data-icon="down"
            ></span>
          </button>
        </div>
        <div id="newExtras" hidden>
          <fieldset>
            <legend>담당자</legend>
            <div class="owner-options" id="newOwners"></div>
            <div class="assignee-statuses" id="newAssigneeStatuses"></div>
          </fieldset>
          <div class="date-fields">
            <label>시작일<input id="newStart" type="date" /></label
            ><label>마감일<input id="newEnd" type="date" /></label>
          </div>
          <label class="field-label"
            >전체 상태<select id="newStatus">
              <option>진행 중</option>
              <option>확인 필요</option>
              <option>완료</option>
            </select></label
          >
        </div>
        <p class="form-error" id="createError" role="alert"></p>
        <div class="dialog-footer">
          <button class="button quiet" type="button" data-close="createDialog">
            취소</button
          ><button class="button primary" type="submit">추가</button>
        </div>
      </form>
    </dialog>
    <dialog id="detailDialog" aria-label="작업 상세" class="detail-dialog">
      <form id="detailForm" class="detail-form">
        <div class="detail-top">
          <span class="eyebrow">작업 상세</span
          ><button
            class="icon-button"
            type="button"
            data-close="detailDialog"
            aria-label="상세 패널 닫기"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <label class="sr-only" for="detailName">작업명</label
        ><textarea
          id="detailName"
          class="detail-name"
          rows="3"
          required
          maxlength="500"
        ></textarea>
        <div class="detail-properties">
          <label class="property-label" for="detailProject">프로젝트</label
          ><select id="detailProject">
            <option value="Luum">Luum</option>
            <option value="LivyDuvy">LiviDuvy</option></select
          ><label class="property-label" for="detailStatus">전체 상태</label
          ><select id="detailStatus">
            <option>진행 중</option>
            <option>확인 필요</option>
            <option>완료</option></select
          ><span class="property-label" id="detailOwnerLabel">담당자</span>
          <div class="collaborator-editor">
            <div
              class="owner-options"
              id="detailOwners"
              role="group"
              aria-labelledby="detailOwnerLabel"
            ></div>
            <div class="assignee-statuses" id="detailAssigneeStatuses"></div>
          </div>
          <label class="property-label" for="detailStart">시작일</label
          ><input id="detailStart" type="date" /><label
            class="property-label"
            for="detailEnd"
            >마감일</label
          ><input id="detailEnd" type="date" />
        </div>
        <label class="description-label" for="detailDescription"
          ><span data-icon="text"></span>작업 메모</label
        ><textarea
          id="detailDescription"
          class="description-input"
          rows="6"
          placeholder="메모"
        ></textarea>
        <p class="form-error" id="detailError" role="alert"></p>
        <div class="detail-footer">
          <button
            type="button"
            id="deleteTask"
            class="icon-button danger"
            aria-label="작업 삭제"
          >
            <span data-icon="trash"></span></button
          ><button type="button" class="button quiet" data-close="detailDialog">
            닫기</button
          ><button class="button primary" type="submit">변경사항 저장</button>
        </div>
      </form>
    </dialog>
    <dialog class="link-dialog" id="linkDialog" aria-labelledby="linkTitle">
      <form id="linkForm">
        <div class="dialog-header">
          <h2 id="linkTitle">자료 링크</h2>
          <button
            class="icon-button"
            type="button"
            data-close="linkDialog"
            aria-label="링크 창 닫기"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <label class="field-label"
          >자료 URL<input
            id="linkUrl"
            type="url"
            placeholder="https://"
            required
        /></label>
        <p class="form-error" id="linkError" role="alert"></p>
        <div class="dialog-footer">
          <button type="button" class="button quiet" data-close="linkDialog">
            취소</button
          ><button class="button primary" type="submit">저장</button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span data-icon="check"></span><span id="toastMessage"></span
      ><button id="undoButton" hidden>되돌리기</button
      ><button id="toastClose" aria-label="알림 닫기">
        <span data-icon="close"></span>
      </button>
    </div>
  </body>
</html>
