<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>졸업전시 팀 대시보드</title>
  <style>
    :root{--ink:#24231f;--muted:#77746b;--line:#dedbd2;--paper:#fff;--canvas:#f5f3ee;--luum:#bc583f;--luum-soft:#f6e3de;--livy:#4661a6;--livy-soft:#e4e9f7;--green:#377b5b;--amber:#a56f1e;--shadow:0 12px 40px rgba(46,42,33,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1480px;margin:auto;padding:42px 32px 80px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(34px,5vw,62px);font-weight:500;letter-spacing:-.045em;line-height:.95;margin:0}.subtitle{color:var(--muted);margin:12px 0 0}.legend{display:flex;gap:14px;white-space:nowrap}.legend span,.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px}.dot{width:9px;height:9px;border-radius:50%}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.calendar-panel{padding:22px;margin-bottom:24px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.panel-title{display:flex;align-items:center;gap:10px}.panel-title h2{font-size:20px;margin:0;letter-spacing:-.02em}.count{font-size:12px;color:var(--muted);background:#efede7;border-radius:999px;padding:4px 8px}.actions{display:flex;gap:8px;align-items:center}button,.button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer}button:hover{background:#f2f0ea}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#3a3832}.icon-btn{width:38px;height:38px;padding:0}.month-label{font-weight:650;min-width:110px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.weekday{padding:10px 8px;color:var(--muted);font-size:11px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em}.day{min-height:112px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;transition:.15s}.day:hover{background:#faf9f6}.day.out{background:#f8f7f3;color:#b6b2a8}.date{font-size:12px;margin-bottom:7px}.today .date{display:grid;place-items:center;background:var(--ink);color:white;width:24px;height:24px;border-radius:50%;margin-top:-4px}.cal-task{font-size:11px;padding:6px 7px;border-radius:7px;margin:4px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}.cal-task.luum{background:var(--luum-soft);border-color:var(--luum)}.cal-task.livyduvy{background:var(--livy-soft);border-color:var(--livy)}.workspace{padding:22px;margin-bottom:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}select,input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.view{display:none}.view.active{display:block}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #ebe9e3;font-size:13px}th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:#faf9f6}tr:last-child td{border-bottom:0}tr{cursor:pointer}.empty{color:#aaa}.status{font-size:11px;border-radius:99px;padding:5px 8px;background:#efede7;display:inline-block}.status[data-status="진행 중"]{background:#e5edf8;color:#345885}.status[data-status="확인 필요"]{background:#f7ecd5;color:#845910}.status[data-status="완료"]{background:#e1f0e8;color:#2f6e51}.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto}.column{background:#f3f1ec;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:260px}.column.over{outline:2px solid var(--ink)}.column-head{display:flex;justify-content:space-between;font-size:13px;font-weight:650;padding:3px 3px 12px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px;box-shadow:0 3px 10px rgba(30,27,20,.04);cursor:grab}.card h3{font-size:14px;margin:0 0 14px;line-height:1.35}.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.resources{padding:22px}.links{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.resource{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:100px;background:#fff}.resource:hover{background:#faf9f6}.resource small{color:var(--muted)}.resource strong{display:block;margin-top:22px;font-size:14px}.dialog{border:0;border-radius:18px;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.2);width:min(540px,calc(100% - 32px))}.dialog::backdrop{background:rgba(28,27,24,.42);backdrop-filter:blur(4px)}.form{padding:24px}.form h2{margin:0 0 22px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.right-actions{display:flex;gap:8px}.danger{color:#a63838;border-color:#e6caca}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:white;padding:12px 16px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:800px){.shell{padding:26px 14px 60px}header{align-items:flex-start;flex-direction:column}.legend{white-space:normal}.calendar-panel,.workspace,.resources{padding:14px;border-radius:14px}.day{min-height:78px;padding:5px}.weekday{padding:8px 2px}.cal-task{font-size:0;height:9px;padding:0}.links{grid-template-columns:1fr 1fr}.panel-head{align-items:flex-start;flex-wrap:wrap}.board{grid-template-columns:repeat(4,260px)}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><p class="eyebrow">Graduation Exhibition · Team Workspace</p><h1>졸업전시 팀 대시보드</h1><p class="subtitle">이번 달 일정과 두 프로젝트의 작업 흐름을 한곳에서 관리합니다.</p></div><div class="legend"><span><i class="dot" style="background:var(--luum)"></i>Luum</span><span><i class="dot" style="background:var(--livy)"></i>LivyDuvy</span></div></header>
  <section class="panel calendar-panel"><div class="panel-head"><div class="panel-title"><h2>통합 캘린더</h2><span class="count" id="monthCount"></span></div><div class="actions"><button class="icon-btn" id="prevMonth" aria-label="이전 달">←</button><span class="month-label" id="monthLabel"></span><button class="icon-btn" id="nextMonth" aria-label="다음 달">→</button><button class="primary" id="addTask">+ 작업 추가</button></div></div><div class="calendar" id="calendar"></div></section>
  <section class="panel workspace"><div class="panel-head"><div class="panel-title"><h2>작업 현황</h2><span class="count" id="taskCount"></span></div><div class="toolbar"><button class="tab active" data-view="table">전체 작업</button><button class="tab" data-view="board">진행 현황</button></div></div><div class="filters"><select id="projectFilter"><option value="">모든 프로젝트</option><option>Luum</option><option>LivyDuvy</option></select><select id="ownerFilter"><option value="">모든 담당자</option></select><label class="button"><input id="hideDone" type="checkbox" checked style="width:auto;margin-right:6px">완료 숨기기</label></div><div class="view active" id="tableView"><div class="table-wrap"><table><thead><tr><th>작업명</th><th>프로젝트</th><th>상태</th><th>담당자</th><th>마감일</th><th>참고 링크</th></tr></thead><tbody id="taskRows"></tbody></table></div></div><div class="view" id="boardView"><div class="board" id="board"></div></div></section>
  <section class="panel resources"><div class="panel-head"><div class="panel-title"><h2>팀 자료 바로가기</h2></div><small style="color:var(--muted)">카드를 눌러 링크를 입력하세요</small></div><div class="links" id="links"></div></section>
</main>
<dialog class="dialog" id="taskDialog"><form class="form" id="taskForm"><h2 id="formTitle">작업 추가</h2><input type="hidden" id="taskId"><div class="field"><label>작업명</label><input id="taskName" required placeholder="수행할 작업"></div><div class="field"><label>프로젝트</label><select id="taskProject" required><option>Luum</option><option>LivyDuvy</option></select></div><div class="field"><label>상태</label><select id="taskStatus"><option>할 일</option><option>진행 중</option><option>확인 필요</option><option>완료</option></select></div><div class="field"><label>담당자</label><input id="taskOwner" placeholder="미정"></div><div class="field"><label>마감일</label><input id="taskDue" type="date"></div><div class="field"><label>참고 링크</label><input id="taskLink" type="url" placeholder="https://"></div><div class="form-actions"><button type="button" class="danger" id="deleteTask">삭제</button><div class="right-actions"><button type="button" id="cancelTask">취소</button><button class="primary" type="submit">저장</button></div></div></form></dialog>
<dialog class="dialog" id="linkDialog"><form class="form" id="linkForm"><h2 id="linkTitle">자료 링크</h2><input type="hidden" id="linkId"><div class="field"><label>URL</label><input id="linkUrl" type="url" placeholder="https://" required></div><div class="form-actions"><span></span><div class="right-actions"><button type="button" id="cancelLink">취소</button><button class="primary" type="submit">저장</button></div></div></form></dialog><div class="toast" id="toast"></div>
<script>
const KEY='grad-exhibition-dashboard-v1';
const defaults={tasks:[{id:'luum-example',name:'[예시] Luum 패키지 디자인 최종 확인',project:'Luum',status:'할 일',owner:'',due:'',link:''},{id:'livy-example',name:'[예시] LivyDuvy UI 화면 최종 확인',project:'LivyDuvy',status:'할 일',owner:'',due:'',link:''}],links:[{id:'luum-drive',label:'Luum',title:'브랜드 에셋 및 제작 자료',url:''},{id:'livy-drive',label:'LivyDuvy',title:'UI/UX 및 3D 에셋',url:''},{id:'budget',label:'공통',title:'예산 Google Sheets',url:''},{id:'figma',label:'공통',title:'Figma 및 주요 공유 자료',url:''}]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults),cursor=new Date();cursor.setDate(1);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}
function filtered(){return state.tasks.filter(t=>(!$('#projectFilter').value||t.project===$('#projectFilter').value)&&(!$('#ownerFilter').value||t.owner===$('#ownerFilter').value)&&(!$('#hideDone').checked||t.status!=='완료'))}
function tag(p){return `<span class="tag"><i class="dot" style="background:var(--${p==='Luum'?'luum':'livy'})"></i>${p}</span>`}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date();$('#monthLabel').textContent=`${y}년 ${m+1}월`;const inMonth=state.tasks.filter(t=>t.due&&new Date(t.due+'T00:00:00').getMonth()===m&&new Date(t.due+'T00:00:00').getFullYear()===y);$('#monthCount').textContent=`일정 ${inMonth.length}`;let html=['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const classes=['day',d.getMonth()!==m?'out':'',d.toDateString()===today.toDateString()?'today':''].join(' ');const tasks=state.tasks.filter(t=>t.due===iso).map(t=>`<div class="cal-task ${t.project.toLowerCase()}" data-id="${t.id}" title="${t.name} · ${t.project} · ${t.owner||'담당자 미정'} · ${t.status}">${t.name}</div>`).join('');html+=`<div class="${classes}" data-date="${iso}"><div class="date">${d.getDate()}</div>${tasks}</div>`}$('#calendar').innerHTML=html;$$('.cal-task').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openTask(e.dataset.id)});$$('.day').forEach(e=>e.ondblclick=()=>openTask(null,e.dataset.date))}
function renderTasks(){const tasks=filtered();$('#taskCount').textContent=`${tasks.length}개`;$('#taskRows').innerHTML=tasks.map(t=>`<tr data-id="${t.id}"><td><strong>${t.name}</strong></td><td>${tag(t.project)}</td><td><span class="status" data-status="${t.status}">${t.status}</span></td><td class="${t.owner?'':'empty'}">${t.owner||'미정'}</td><td class="${t.due?'':'empty'}">${t.due||'미정'}</td><td>${t.link?`<a href="${t.link}" target="_blank" onclick="event.stopPropagation()">열기 ↗</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">조건에 맞는 작업이 없습니다.</td></tr>';$$('#taskRows tr[data-id]').forEach(r=>r.onclick=()=>openTask(r.dataset.id));const statuses=['할 일','진행 중','확인 필요','완료'];$('#board').innerHTML=statuses.map(s=>{const items=tasks.filter(t=>t.status===s);return `<div class="column" data-status="${s}"><div class="column-head"><span>${s}</span><span>${items.length}</span></div>${items.map(t=>`<article class="card" draggable="true" data-id="${t.id}"><h3>${t.name}</h3><div class="card-meta">${tag(t.project)}<span>${t.owner||'미정'}${t.due?' · '+t.due.slice(5):''}</span></div></article>`).join('')}</div>`}).join('');$$('.card').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id);c.onclick=()=>openTask(c.dataset.id)});$$('.column').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');col.ondrop=e=>{e.preventDefault();col.classList.remove('over');const t=state.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.status=col.dataset.status;save();render();toast('상태가 변경되었습니다')}}});renderOwners()}
function renderOwners(){const selected=$('#ownerFilter').value,owners=[...new Set(state.tasks.map(t=>t.owner).filter(Boolean))].sort();$('#ownerFilter').innerHTML='<option value="">모든 담당자</option>'+owners.map(o=>`<option>${o}</option>`).join('');$('#ownerFilter').value=owners.includes(selected)?selected:''}
function renderLinks(){$('#links').innerHTML=state.links.map(l=>`<a class="resource" href="${l.url||'#'}" data-id="${l.id}" ${l.url?'target="_blank"':''}><small>${l.label}</small><strong>${l.title} ${l.url?'↗':'＋'}</strong></a>`).join('');$$('.resource').forEach(a=>a.onclick=e=>{if(!a.dataset.id)return;if(!state.links.find(x=>x.id===a.dataset.id).url||e.altKey){e.preventDefault();openLink(a.dataset.id)}})}
function render(){renderCalendar();renderTasks();renderLinks()}
function openTask(id,date=''){const t=state.tasks.find(x=>x.id===id);$('#formTitle').textContent=t?'작업 수정':'작업 추가';$('#taskId').value=t?.id||'';$('#taskName').value=t?.name||'';$('#taskProject').value=t?.project||'Luum';$('#taskStatus').value=t?.status||'할 일';$('#taskOwner').value=t?.owner||'';$('#taskDue').value=t?.due||date;$('#taskLink').value=t?.link||'';$('#deleteTask').style.visibility=t?'visible':'hidden';$('#taskDialog').showModal();setTimeout(()=>$('#taskName').focus(),0)}
$('#taskForm').onsubmit=e=>{e.preventDefault();const id=$('#taskId').value||crypto.randomUUID(),t={id,name:$('#taskName').value.trim(),project:$('#taskProject').value,status:$('#taskStatus').value,owner:$('#taskOwner').value.trim(),due:$('#taskDue').value,link:$('#taskLink').value.trim()},i=state.tasks.findIndex(x=>x.id===id);i<0?state.tasks.push(t):state.tasks[i]=t;save();$('#taskDialog').close();render();toast('작업이 저장되었습니다')};$('#deleteTask').onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!==$('#taskId').value);save();$('#taskDialog').close();render();toast('작업이 삭제되었습니다')};$('#cancelTask').onclick=()=>$('#taskDialog').close();$('#addTask').onclick=()=>openTask();
function openLink(id){const l=state.links.find(x=>x.id===id);$('#linkId').value=id;$('#linkTitle').textContent=l.title;$('#linkUrl').value=l.url;$('#linkDialog').showModal()}$('#linkForm').onsubmit=e=>{e.preventDefault();state.links.find(x=>x.id===$('#linkId').value).url=$('#linkUrl').value.trim();save();$('#linkDialog').close();renderLinks();toast('링크가 저장되었습니다')};$('#cancelLink').onclick=()=>$('#linkDialog').close();
$('#prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderCalendar()};$('#projectFilter').onchange=$('#ownerFilter').onchange=$('#hideDone').onchange=renderTasks;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active')});render();
</script>
</body></html>
